<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Checklist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#eee9dd;
    --panel:#f7f3e8;
    --line:#d8cfb8;
    --ink:#2a2417;
    --ink-dim:#7c7460;
    --accent:#a8632b;
    --accent-glow:rgba(168,99,43,0.35);
    --brass:#8a6d3b;
    --off:#c7bda0;
  }
  [data-theme="dark"]{
    --bg:#14120e;
    --panel:#1d1a14;
    --line:#332d21;
    --ink:#ece5d3;
    --ink-dim:#8c8367;
    --accent:#d99a4e;
    --accent-glow:rgba(217,154,78,0.3);
    --brass:#d9a94a;
    --off:#3a3527;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:56px 16px;
    transition:background 0.3s ease, color 0.3s ease;
  }
  .wrap{
    width:100%;
    max-width:420px;
  }
  .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:6px;
  }
  .eyebrow{
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--brass);
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    margin:2px 0 0 0;
    letter-spacing:0.2px;
  }
  #themeBtn{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    width:34px;
    height:34px;
    border-radius:50%;
    cursor:pointer;
    font-size:14px;
    flex-shrink:0;
  }
  .sub{
    color:var(--ink-dim);
    font-size:12px;
    margin:10px 0 28px 0;
    line-height:1.6;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    margin-bottom:22px;
  }
  .switch-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 14px;
    border-bottom:1px solid var(--line);
  }
  .switch-row:last-child{ border-bottom:none; }

  .switch{
    position:relative;
    width:52px;
    height:28px;
    flex-shrink:0;
    background:var(--off);
    border-radius:999px;
    cursor:pointer;
    transition:background 0.25s ease;
    border:1px solid var(--line);
  }
  .switch .knob{
    position:absolute;
    top:2px;
    left:2px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--panel);
    box-shadow:0 1px 2px rgba(0,0,0,0.25);
    transition:transform 0.25s cubic-bezier(.4,1.6,.4,1);
  }
  .switch.on{
    background:var(--accent);
    border-color:var(--accent);
  }
  .switch.on .knob{
    transform:translateX(24px);
    background:#fff;
  }

  .switch-text{
    font-size:13.5px;
    line-height:1.4;
    color:var(--ink);
  }
  .switch-row.on .switch-text{
    color:var(--ink);
  }
  .switch-row:not(.on) .switch-text{
    color:var(--ink-dim);
  }

  .arm-zone{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:6px;
  }
  .arm-btn{
    position:relative;
    width:132px;
    height:132px;
    border-radius:50%;
    background:var(--panel);
    border:1px solid var(--line);
    cursor:not-allowed;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    user-select:none;
  }
  .arm-btn.ready{
    cursor:pointer;
    border-color:var(--accent);
  }
  .arm-btn svg{
    position:absolute;
    top:0; left:0;
    width:132px; height:132px;
    transform:rotate(-90deg);
  }
  .arm-btn circle.track{
    fill:none;
    stroke:var(--line);
    stroke-width:3;
  }
  .arm-btn circle.fill{
    fill:none;
    stroke:var(--accent);
    stroke-width:3;
    stroke-linecap:round;
    stroke-dasharray:377;
    stroke-dashoffset:377;
  }
  .arm-label{
    font-family:'Fraunces', serif;
    font-size:14px;
    letter-spacing:0.5px;
    color:var(--ink-dim);
    text-align:center;
    z-index:1;
  }
  .arm-btn.ready .arm-label{
    color:var(--ink);
  }
  .arm-hint{
    margin-top:14px;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  @keyframes stampIn{
    0%{ opacity:0; transform:scale(0.85) rotate(-4deg); }
    60%{ opacity:1; transform:scale(1.04) rotate(1deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  .result{
    display:none;
    margin-top:22px;
    padding:20px;
    border-radius:14px;
    border:1.5px solid var(--accent);
    background:var(--panel);
    text-align:center;
    animation:stampIn 0.45s cubic-bezier(.2,1.4,.4,1);
  }
  .result.show{ display:block; }
  .result-tag{
    font-family:'Fraunces', serif;
    font-size:15px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;
  }
  .result-line{
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink);
  }
  .streak{
    margin-top:10px;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  .insta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:32px;
    padding:12px;
    border-radius:10px;
    color:var(--ink-dim);
    text-decoration:none;
    font-size:12px;
    letter-spacing:0.5px;
    border:1px solid var(--line);
  }
  .insta:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">Before you enter</div>
      <h1>The checklist</h1>
    </div>
    <button id="themeBtn">◐</button>
  </div>
  <div class="sub">Flip all three, then hit let's go. No shortcuts.</div>

  <div class="panel">
    <div class="switch-row" data-idx="0">
      <div class="switch"><div class="knob"></div></div>
      <div class="switch-text">Is this trade on my plan?</div>
    </div>
    <div class="switch-row" data-idx="1">
      <div class="switch"><div class="knob"></div></div>
      <div class="switch-text">Have I decided my TP and SL?</div>
    </div>
    <div class="switch-row" data-idx="2">
      <div class="switch"><div class="knob"></div></div>
      <div class="switch-text">Is price on support or resistance?</div>
    </div>
  </div>

  <div class="arm-zone">
    <button class="arm-btn" id="armBtn">
      <svg viewBox="0 0 132 132">
        <circle class="track" cx="66" cy="66" r="60"></circle>
        <circle class="fill" id="armFill" cx="66" cy="66" r="60"></circle>
      </svg>
      <div class="arm-label" id="armLabel">Complete<br>checklist</div>
    </button>
    <div class="arm-hint" id="armHint">All three required</div>
  </div>

  <div class="result" id="result">
    <div class="result-tag">Let's go</div>
    <div class="result-line" id="resultLine"></div>
    <div class="streak" id="streak"></div>
  </div>

  <a class="insta" href="https://www.instagram.com/ayush.is.now/" target="_blank" rel="noopener">
    @ayush.is.now
  </a>
</div>

<script>
const checked = [false, false, false];
let armed = 0;
const HOLD_MS = 900;
let holding = false;
let startTime = 0;
let rafId = null;

const lines = [
  "Plan checked. TP and SL set. This is what discipline looks like.",
  "You didn't skip a step. That's the trade already half-won.",
  "No hesitation, no shortcuts. Execute it exactly as planned.",
  "Every switch was earned. Trust the process, not the outcome.",
  "This is a planned trade, not a gamble. Stick to the plan now."
];

document.querySelectorAll('.switch-row').forEach(row => {
  row.addEventListener('click', () => {
    const idx = parseInt(row.dataset.idx, 10);
    checked[idx] = !checked[idx];
    row.classList.toggle('on', checked[idx]);
    row.querySelector('.switch').classList.toggle('on', checked[idx]);
    updateArmState();
  });
});

function updateArmState(){
  const allChecked = checked.every(v => v);
  const btn = document.getElementById('armBtn');
  const label = document.getElementById('armLabel');
  const hint = document.getElementById('armHint');
  btn.classList.toggle('ready', allChecked);
  if(allChecked){
    label.innerHTML = "Let's<br>go";
    hint.textContent = 'Tap to confirm';
  } else {
    label.innerHTML = 'Complete<br>checklist';
    hint.textContent = 'All three required';
  }
}

const armBtn = document.getElementById('armBtn');
const armFill = document.getElementById('armFill');
const CIRC = 377;

armBtn.addEventListener('click', () => {
  const allChecked = checked.every(v => v);
  if(!allChecked) return;
  armFill.style.transition = 'stroke-dashoffset 0.35s ease';
  armFill.style.strokeDashoffset = 0;
  setTimeout(() => {
    fireArm();
    armFill.style.transition = 'none';
    armFill.style.strokeDashoffset = CIRC;
  }, 350);
});

function fireArm(){
  armed += 1;
  const result = document.getElementById('result');
  document.getElementById('resultLine').textContent = lines[Math.floor(Math.random() * lines.length)];
  document.getElementById('streak').textContent = 'Trade ' + armed + ' taken with a full checklist';
  result.classList.remove('show');
  void result.offsetWidth;
  result.classList.add('show');

  checked.fill(false);
  document.querySelectorAll('.switch-row').forEach(row => {
    row.classList.remove('on');
    row.querySelector('.switch').classList.remove('on');
  });
  updateArmState();
  armFill.style.strokeDashoffset = CIRC;
}

const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  themeBtn.textContent = isDark ? '◐' : '◑';
});
</script>
</body>
</html>
